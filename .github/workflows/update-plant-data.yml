name: Update Plant Atlas data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of accepted WCVP species to import'
        required: false
        default: '10000'
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current WCVP
        run: python scripts/download_sources.py --wcvp --wgsrpd --dir source-downloads
      - name: Import WCVP
        run: python scripts/import_wcvp.py --zip source-downloads/wcvp_dwca.zip --limit ${{ inputs.limit || 10000 }} --out data/catalog
      - name: Match GBIF/COL XR identifiers
        run: python scripts/match_gbif.py --catalog data/catalog --max ${{ inputs.limit || 10000 }} --delay 0.2
      - name: Apply curated invasive records
        run: python scripts/apply_invasive.py --catalog data/catalog --csv data/sources/invasive.csv
      - name: Build search index
        run: python scripts/build_search_index.py data/catalog
      - name: Validate
        run: python scripts/validate_catalog.py data/catalog
      - name: Commit
        run: |
          git config user.name 'Plant Atlas Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A data/catalog data/level3
          git commit -m 'Update Plant Atlas species data' || exit 0
          git push
